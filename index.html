<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f5b7c4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="豆豆" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <title>豆豆 · 你的小伙伴</title>
</head>
<body>
  <div id="app">
    <!-- screens are injected by ui.js -->
    <div id="screen-root"></div>
    <!-- proactive message toast -->
    <div id="toast-layer"></div>
  </div>

  <!-- TEMP DEBUG: surface any uncaught error on-screen (remove after diagnosing) -->
  <script>
    (function () {
      var BUILD = 'debug-3';
      function show(label, msg) {
        var full = '[' + label + '] ' + msg;
        var box = document.getElementById('__errbox');
        if (!box) {
          box = document.createElement('div');
          box.id = '__errbox';
          box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;max-height:60%;overflow:auto;background:#b00020;color:#fff;font:12px/1.4 monospace;padding:10px;white-space:pre-wrap;word-break:break-word';
          document.body.appendChild(box);
        }
        box.textContent += full + '\n\n';
        try { alert('PetPal ' + BUILD + ' 报错:\n' + full); } catch (e) {}
      }
      window.addEventListener('error', function (e) {
        show('ERROR', (e.message || e.error) + '\n@ ' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || '') + (e.error && e.error.stack ? '\n' + e.error.stack : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        show('PROMISE', (r && r.message ? r.message : r) + (r && r.stack ? '\n' + r.stack : ''));
      });
      // 屏幕角落印一个版本号,确认加载的是新版而非缓存
      window.addEventListener('DOMContentLoaded', function () {
        var v = document.createElement('div');
        v.textContent = 'build ' + BUILD;
        v.style.cssText = 'position:fixed;top:2px;right:4px;z-index:99999;font:10px monospace;color:#fff;background:rgba(0,0,0,.45);padding:1px 5px;border-radius:6px;pointer-events:none';
        document.body.appendChild(v);
      });
    })();
  </script>

  <!-- load order matters: store -> systems -> conversation/proactive/events -> ui -> app -->
  <script src="js/store.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/persona.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/parallax.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/emotion.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/dreams.js"></script>
  <script src="js/conversation.js"></script>
  <script src="js/events.js"></script>
  <script src="js/proactive.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
